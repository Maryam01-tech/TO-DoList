<!DOCTYPE html><html>
<head>
    <title>Shopping Database</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body><h1>Customer Shopping Records</h1>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Customer</th>
        <th>Product</th>
        <th>Price</th>
        <th>Quantity</th>
    </tr>

    {% for item in data %}
    <tr>
        <td>{{ item.id }}</td>
        <td>{{ item.customer }}</td>
        <td>{{ item.product }}</td>
        <td>{{ item.price }}</td>
        <td>{{ item.quantity }}</td>
    </tr>
    {% endfor %}
</table>

<br>
<a href="/">Back to Home</a>

</body>
</html>
